        <text x="395" y="209">支出</text>
        <text x="459" y="209">结余</text>
      </g>

      <rect x="534" y="122" width="91" height="104" rx="17" fill="#fff" fill-opacity=".72" stroke="#c4b38d" stroke-opacity=".35"/>
      <text x="550" y="150" fill="#3d424a" font-size="12" font-weight="800">预算进度</text>
      <circle cx="579" cy="184" r="25" fill="none" stroke="#dad0bb" stroke-width="8"/>
      <path d="M579 159A25 25 0 0 1 602 194" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>

      <rect x="313" y="240" width="143" height="91" rx="17" fill="#fff" fill-opacity=".72" stroke="#c4b38d" stroke-opacity=".35"/>
      <text x="331" y="265" fill="#3d424a" font-size="12" font-weight="800">快速记账</text>
      <g fill="url(#accent)">
        <rect x="332" y="282" width="20" height="30" rx="6"/>
        <rect x="361" y="272" width="20" height="40" rx="6" opacity=".82"/>
        <rect x="390" y="289" width="20" height="23" rx="6" opacity=".66"/>
        <rect x="419" y="278" width="20" height="34" rx="6" opacity=".76"/>
