<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">肥喵记账个人财务数据产品封面</title>
  <desc id="desc">以脱敏界面结构示意展示快速记账、预算管理、统计复盘和本地数据模型，不含真实账单。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#25080d"/>
      <stop offset="0.58" stop-color="#090506"/>
      <stop offset="1" stop-color="#5b0914"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ed"/>
      <stop offset="1" stop-color="#f4dfba"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#ff8d98"/>
      <stop offset="1" stop-color="#ff243d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="720" height="420" rx="24" fill="url(#bg)"/>
  <path d="M0 70H720M0 140H720M0 210H720M0 280H720M0 350H720M80 0V420M160 0V420M240 0V420M320 0V420M400 0V420M480 0V420M560 0V420M640 0V420" stroke="#fff" stroke-opacity=".045"/>
  <g transform="translate(-43.2 -25.2) scale(1.12)">
