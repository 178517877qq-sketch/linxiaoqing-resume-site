      <text x="52" y="118" fill="#fff7f7" font-size="35" font-weight="900">肥喵记账</text>
      <text x="52" y="147" fill="#fff1e5" fill-opacity=".76" font-size="15" font-weight="700">个人财务数据产品实践</text>

      <g fill="#16070a" stroke="#ff6b78" stroke-opacity=".36">
        <rect x="52" y="176" width="88" height="32" rx="9"/>
        <rect x="148" y="176" width="82" height="32" rx="9"/>
        <rect x="52" y="218" width="178" height="32" rx="9"/>
      </g>
      <g fill="#fff7f7" fill-opacity=".84" font-size="12" font-weight="700" text-anchor="middle">
        <text x="96" y="197">本地优先</text>
        <text x="189" y="197">Android</text>
        <text x="141" y="239">Flutter · SQLite</text>
      </g>

      <g fill="none" stroke="#ff6575" stroke-width="2.5" stroke-linecap="round">
        <path d="M57 283H215" stroke-opacity=".35"/>
        <path d="M60 283L96 283L125 304L160 267L212 267"/>
      </g>
      <g fill="#ff6575">
        <circle cx="60" cy="283" r="5"/>
        <circle cx="125" cy="304" r="5"/>
        <circle cx="160" cy="267" r="5"/>
        <circle cx="212" cy="267" r="5"/>
      </g>
      <g fill="#fff7f7" fill-opacity=".72" font-size="12" font-weight="700" text-anchor="middle">
