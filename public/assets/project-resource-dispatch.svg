<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">数据管理与资源派发流程图</title>
  <desc id="desc">客户数据经过校验、规则分组、资源派发和异常回流的业务数据流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#23070b"/>
      <stop offset="0.55" stop-color="#080405"/>
      <stop offset="1" stop-color="#7d0816"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0" stop-color="#ff6b78"/>
      <stop offset="1" stop-color="#ff243d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1 0 0 0 0 .12 0 0 0 0 .22 0 0 0 .65 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="420" rx="24" fill="url(#bg)"/>
  <path d="M0 95H720M0 190H720M0 285H720M120 0V420M240 0V420M360 0V420M480 0V420M600 0V420" stroke="#fff" stroke-opacity=".07"/>
  <rect x="54" y="70" width="158" height="88" rx="16" fill="#12070a" stroke="#ff6b78" stroke-opacity=".5"/>
  <rect x="281" y="70" width="158" height="88" rx="16" fill="#12070a" stroke="#ff6b78" stroke-opacity=".5"/>
  <rect x="508" y="70" width="158" height="88" rx="16" fill="#12070a" stroke="#ff6b78" stroke-opacity=".5"/>
  <rect x="168" y="258" width="158" height="88" rx="16" fill="#12070a" stroke="#ff6b78" stroke-opacity=".5"/>
  <rect x="394" y="258" width="158" height="88" rx="16" fill="#12070a" stroke="#ff6b78" stroke-opacity=".5"/>
  <g filter="url(#glow)" stroke="url(#red)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M212 114H281"/>
    <path d="M439 114H508"/>
    <path d="M586 158v54c0 25-20 46-46 46H472"/>
    <path d="M394 302H326"/>
    <path d="M247 258V188c0-17 14-30 30-30h83"/>
  </g>
  <g fill="#fff7f7" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="800">
    <text x="83" y="106" font-size="22">客户数据</text>
    <text x="83" y="136" font-size="16" opacity=".62">导入 / 校验</text>
    <text x="310" y="106" font-size="22">规则分组</text>
    <text x="310" y="136" font-size="16" opacity=".62">口径 / 标签</text>
    <text x="537" y="106" font-size="22">资源派发</text>
    <text x="537" y="136" font-size="16" opacity=".62">批次 / 进度</text>
    <text x="197" y="294" font-size="22">异常回流</text>
    <text x="197" y="324" font-size="16" opacity=".62">重复 / 缺失</text>
    <text x="423" y="294" font-size="22">跟进复盘</text>
    <text x="423" y="324" font-size="16" opacity=".62">结果 / 调整</text>
  </g>
  <circle cx="360" cy="206" r="34" fill="url(#red)" opacity=".9"/>
  <path d="M346 207l10 10 20-25" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
