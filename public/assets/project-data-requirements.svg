<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">数据功能需求协同流程</title>
  <desc id="desc">业务反馈进入需求池，经字段口径、报表逻辑和开发协同后形成数据功能优化。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2a0b10"/>
      <stop offset="0.55" stop-color="#100507"/>
      <stop offset="1" stop-color="#a6091c"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0" stop-color="#ff8992"/>
      <stop offset="1" stop-color="#ff243d"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="560" cy="126" r="168" fill="#ff243d" opacity=".16"/>
  <circle cx="178" cy="298" r="146" fill="#ff6b78" opacity=".08"/>
  <g fill="#15070a" stroke="#ff6b78" stroke-opacity=".42">
    <rect x="52" y="60" width="190" height="116" rx="18"/>
    <rect x="265" y="60" width="190" height="116" rx="18"/>
    <rect x="478" y="60" width="190" height="116" rx="18"/>
    <rect x="152" y="244" width="416" height="98" rx="18"/>
  </g>
  <g stroke="url(#red)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M242 118H265"/>
    <path d="M455 118H478"/>
    <path d="M573 176v37c0 17-14 31-31 31H360"/>
    <path d="M147 176v37c0 17 14 31 31 31h182"/>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" fill="#fff7f7">
    <text x="82" y="106" font-size="22" font-weight="900">业务反馈</text>
    <text x="82" y="138" font-size="15" opacity=".62" font-weight="700">会议 / 使用问题</text>
    <text x="295" y="106" font-size="22" font-weight="900">需求整理</text>
    <text x="295" y="138" font-size="15" opacity=".62" font-weight="700">字段 / 口径 / 优先级</text>
    <text x="508" y="106" font-size="22" font-weight="900">开发协同</text>
    <text x="508" y="138" font-size="15" opacity=".62" font-weight="700">报表逻辑 / 功能体验</text>
    <text x="194" y="292" font-size="24" font-weight="900">数据功能优化闭环</text>
    <text x="194" y="322" font-size="16" opacity=".68" font-weight="700">上线验证 / 问题跟踪 / 复盘沉淀</text>
  </g>
  <g fill="none" stroke="#fff7f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M122 94h50M122 120h76M122 146h44" opacity=".72"/>
    <path d="M330 93h60M330 119h84M330 145h52" opacity=".72"/>
    <path d="M542 91l22 22 36-44" opacity=".84"/>
  </g>
