<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">国际热门小说年度趋势专业指标封面</title>
  <desc id="desc">展示 Goodreads 热门小说平台热度回落、评论参与率提升和题材结构迁移。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#21070b"/>
      <stop offset="0.56" stop-color="#070405"/>
      <stop offset="1" stop-color="#5c0711"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0" stop-color="#ff7b86"/>
      <stop offset="1" stop-color="#ff243d"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" x2="1">
      <stop offset="0" stop-color="#fff1e5"/>
      <stop offset="1" stop-color="#ff8a94"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" rx="24" fill="url(#bg)"/>
  <path d="M0 78H720M0 156H720M0 234H720M0 312H720M90 0V420M180 0V420M270 0V420M360 0V420M450 0V420M540 0V420M630 0V420" stroke="#fff" stroke-opacity=".06"/>
  <g fill="#15070a" stroke="#ff6b78" stroke-opacity=".38">
    <rect x="46" y="44" width="188" height="96" rx="16"/>
    <rect x="266" y="44" width="188" height="96" rx="16"/>
    <rect x="486" y="44" width="188" height="96" rx="16"/>
    <rect x="46" y="178" width="292" height="178" rx="18"/>
    <rect x="382" y="178" width="292" height="178" rx="18"/>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" fill="#fff7f7">
    <text x="70" y="76" font-size="21" opacity=".9" font-weight="800">热度回落</text>
    <text x="70" y="117" font-size="34" font-weight="900">-45.8%</text>
    <text x="70" y="132" font-size="11" opacity=".58" font-weight="700">2025 vs 2022峰值</text>
    <text x="290" y="76" font-size="21" opacity=".9" font-weight="800">评论参与</text>
    <text x="290" y="117" font-size="34" font-weight="900">+2.8pp</text>
    <text x="290" y="132" font-size="11" opacity=".58" font-weight="700">10.35% -> 13.13%</text>
    <text x="510" y="76" font-size="21" opacity=".9" font-weight="800">题材迁移</text>
    <text x="510" y="117" font-size="34" font-weight="900">8.0pp</text>
    <text x="510" y="132" font-size="11" opacity=".58" font-weight="700">Romance 年度波动</text>
    <text x="70" y="220" font-size="18" font-weight="900">热度与互动趋势</text>
    <text x="406" y="220" font-size="18" font-weight="900">2021 -> 2025 题材结构</text>
  </g>
  <path d="M78 326 H310" stroke="#fff" stroke-opacity=".12"/>
  <path d="M78 291 H310M78 256 H310" stroke="#fff" stroke-opacity=".08"/>
  <path d="M88 278 L130 258 L172 277 L214 302 L256 324" stroke="url(#red)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M88 319 L130 322 L172 303 L214 290 L256 263" stroke="url(#cream)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>
