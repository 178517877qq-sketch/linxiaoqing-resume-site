    <text x="490" y="344">Thr</text>
    <text x="568" y="344">Lit</text>
    <text x="410" y="238">59</text>
    <text x="438" y="238">60</text>
    <text x="490" y="274">31</text>
    <text x="518" y="267">37</text>
    <text x="570" y="303">12</text>
    <text x="598" y="298">16</text>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" fill="#fff1e5" opacity=".6" font-size="9" font-weight="700">
    <text x="420" y="360">2021</text>
    <text x="444" y="360">2025</text>
  </g>
  <text x="46" y="386" fill="#fff7f7" opacity=".5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">Goodreads 指标是平台热度与互动代理，不等同销量；2025 Top10热度占比28.3%</text>
