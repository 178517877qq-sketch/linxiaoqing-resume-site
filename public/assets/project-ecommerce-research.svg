      <stop offset="0" stop-color="#21070b"/>
      <stop offset="0.56" stop-color="#070405"/>
      <stop offset="1" stop-color="#5c0711"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0" stop-color="#ff7b86"/>
      <stop offset="1" stop-color="#ff243d"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" x2="1">
      <stop offset="0" stop-color="#fff1e5"/>
      <stop offset="1" stop-color="#ff8a94"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" rx="24" fill="url(#bg)"/>
  <path d="M0 78H720M0 156H720M0 234H720M0 312H720M90 0V420M180 0V420M270 0V420M360 0V420M450 0V420M540 0V420M630 0V420" stroke="#fff" stroke-opacity=".06"/>
  <g transform="translate(-43.2 -25.2) scale(1.12)">
