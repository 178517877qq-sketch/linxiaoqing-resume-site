<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">中国电商消费趋势分析封面</title>
  <desc id="desc">展示中国电商消费趋势中的 2025 线上零售规模、2021-2025 复合增速、线上化占比和领域结构。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#21070b"/>
      <stop offset="0.56" stop-color="#070405"/>
      <stop offset="1" stop-color="#5c0711"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0" stop-color="#ff7b86"/>
      <stop offset="1" stop-color="#ff243d"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" x2="1">
      <stop offset="0" stop-color="#fff1e5"/>
      <stop offset="1" stop-color="#ff8a94"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" rx="24" fill="url(#bg)"/>
  <path d="M0 78H720M0 156H720M0 234H720M0 312H720M90 0V420M180 0V420M270 0V420M360 0V420M450 0V420M540 0V420M630 0V420" stroke="#fff" stroke-opacity=".06"/>
  <g fill="#15070a" stroke="#ff6b78" stroke-opacity=".38">
    <rect x="46" y="44" width="188" height="96" rx="16"/>
    <rect x="266" y="44" width="188" height="96" rx="16"/>
    <rect x="486" y="44" width="188" height="96" rx="16"/>
    <rect x="46" y="178" width="292" height="178" rx="18"/>
    <rect x="382" y="178" width="292" height="178" rx="18"/>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" fill="#fff7f7">
    <text x="70" y="77" font-size="22" opacity=".9" font-weight="800">线上零售额</text>
    <text x="70" y="124" font-size="34" font-weight="900">15.97万亿</text>
    <text x="290" y="77" font-size="22" opacity=".9" font-weight="800">5年CAGR</text>
    <text x="290" y="124" font-size="34" font-weight="900">5.1%</text>
    <text x="510" y="77" font-size="22" opacity=".9" font-weight="800">实物线上化</text>
    <text x="510" y="124" font-size="34" font-weight="900">26.1%</text>
    <text x="70" y="220" font-size="18" font-weight="900">线上零售趋势</text>
    <text x="406" y="220" font-size="18" font-weight="900">2025领域结构</text>
  </g>
  <path d="M78 307 L132 297 L184 274 L238 272 L310 264" stroke="url(#red)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78 329 L132 310 L184 291 L238 290 L310 289" stroke="url(#cream)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".78"/>
  <path d="M78 330 H310" stroke="#fff" stroke-opacity=".12"/>
  <path d="M78 292 H310M78 254 H310" stroke="#fff" stroke-opacity=".08"/>
  <g fill="#fff7f7" opacity=".84">
    <circle cx="78" cy="307" r="5"/>
    <circle cx="184" cy="274" r="5"/>
    <circle cx="310" cy="264" r="5"/>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" fill="#fff7f7" opacity=".62" font-size="12" font-weight="700">
    <text x="68" y="346">2021</text>
    <text x="168" y="346">2023</text>
    <text x="294" y="346">2025</text>
  </g>
  <g fill="url(#red)">
    <rect x="422" y="238" width="30" height="88" rx="6" opacity=".72"/>
    <rect x="468" y="286" width="30" height="40" rx="6" opacity=".82"/>
    <rect x="514" y="288" width="30" height="38" rx="6"/>
    <rect x="560" y="298" width="30" height="28" rx="6" opacity=".76"/>
    <rect x="606" y="308" width="30" height="18" rx="6" opacity=".66"/>
  </g>
  <text x="512" y="280" fill="#fff1e5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="900">+16.2%</text>
  <g font-family="Microsoft YaHei, Arial, sans-serif" fill="#fff7f7" opacity=".7" font-size="11" font-weight="700">
    <text x="414" y="344">交通</text>
    <text x="462" y="344">食品</text>
    <text x="508" y="344">家居</text>
    <text x="554" y="344">服饰</text>
    <text x="600" y="344">医药</text>
  </g>
  <text x="46" y="386" fill="#fff7f7" opacity=".5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">国家统计局年度累计口径，金额为名义值</text>
</svg>
