<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">核心评分股票研究库专业指标封面</title>
  <desc id="desc">展示股票研究库的本地验证超额、最大回撤、流动性和 Top100 因子暴露。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#21070b"/>
      <stop offset="0.56" stop-color="#070405"/>
      <stop offset="1" stop-color="#5c0711"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0" stop-color="#ff7b86"/>
      <stop offset="1" stop-color="#ff243d"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" x2="1">
      <stop offset="0" stop-color="#fff1e5"/>
      <stop offset="1" stop-color="#ff8a94"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" rx="24" fill="url(#bg)"/>
  <path d="M0 78H720M0 156H720M0 234H720M0 312H720M90 0V420M180 0V420M270 0V420M360 0V420M450 0V420M540 0V420M630 0V420" stroke="#fff" stroke-opacity=".06"/>
  <g fill="#15070a" stroke="#ff6b78" stroke-opacity=".38">
    <rect x="46" y="44" width="188" height="96" rx="16"/>
    <rect x="266" y="44" width="188" height="96" rx="16"/>
    <rect x="486" y="44" width="188" height="96" rx="16"/>
    <rect x="46" y="178" width="292" height="178" rx="18"/>
    <rect x="382" y="178" width="292" height="178" rx="18"/>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" fill="#fff7f7">
    <text x="70" y="76" font-size="21" opacity=".9" font-weight="800">验证超额</text>
    <text x="70" y="117" font-size="34" font-weight="900">+10.6pp</text>
    <text x="70" y="132" font-size="11" opacity=".58" font-weight="700">v4 Top100 vs 基准</text>
    <text x="290" y="76" font-size="21" opacity=".9" font-weight="800">平均回撤</text>
    <text x="290" y="117" font-size="34" font-weight="900">-27.0%</text>
    <text x="290" y="132" font-size="11" opacity=".58" font-weight="700">Top100 风险边界</text>
    <text x="510" y="76" font-size="21" opacity=".9" font-weight="800">流动性</text>
    <text x="510" y="117" font-size="34" font-weight="900">10.9亿</text>
    <text x="510" y="132" font-size="11" opacity=".58" font-weight="700">日均成交额中位数</text>
    <text x="70" y="220" font-size="18" font-weight="900">Top100 vs baseline</text>
    <text x="406" y="220" font-size="18" font-weight="900">Top100 因子暴露</text>
  </g>
  <path d="M78 296 H310" stroke="#fff1e5" stroke-width="2" stroke-dasharray="8 7" opacity=".56"/>
  <text x="264" y="291" fill="#fff1e5" opacity=".72" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="800">baseline 67.7%</text>
  <path d="M78 326 H310" stroke="#fff" stroke-opacity=".12"/>
  <path d="M78 279 H310M78 244 H310" stroke="#fff" stroke-opacity=".08"/>
  <g fill="url(#red)">
    <rect x="91" y="291" width="28" height="35" rx="7" opacity=".74"/>
    <rect x="137" y="308" width="28" height="18" rx="7" opacity=".62"/>
    <rect x="183" y="296" width="28" height="30" rx="7" opacity=".8"/>
    <rect x="229" y="272" width="28" height="54" rx="7"/>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" fill="#fff7f7" opacity=".72" font-size="10" font-weight="800">
    <text x="90" y="344">v1</text>
    <text x="136" y="344">v2</text>
    <text x="182" y="344">v3</text>
    <text x="228" y="344">v4</text>
    <text x="84" y="282">70.2</text>
    <text x="222" y="263">78.3</text>
  </g>
  <g fill="url(#red)">
    <rect x="414" y="281" width="20" height="45" rx="6" opacity=".62"/>
    <rect x="446" y="245" width="20" height="81" rx="6"/>
    <rect x="478" y="260" width="20" height="66" rx="6" opacity=".8"/>
    <rect x="510" y="251" width="20" height="75" rx="6" opacity=".9"/>
    <rect x="542" y="268" width="20" height="58" rx="6" opacity=".72"/>
    <rect x="574" y="249" width="20" height="77" rx="6" opacity=".94"/>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" fill="#fff7f7" opacity=".72" font-size="10" font-weight="700">
    <text x="409" y="344">质量</text>
    <text x="441" y="344">趋势</text>
    <text x="473" y="344">流动</text>
    <text x="505" y="344">估值</text>
    <text x="537" y="344">风险</text>
    <text x="569" y="344">主题</text>
  </g>
  <text x="46" y="386" fill="#fff7f7" opacity=".5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">本地样本池验证；1,901只股票、6维评分框架仅为研究底座，不代表投资建议</text>
</svg>
