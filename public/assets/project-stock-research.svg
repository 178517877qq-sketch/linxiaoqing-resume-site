<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">A股基本面与估值研究框架封面</title>
  <desc id="desc">展示股票研究框架中财报覆盖、PE覆盖、PB覆盖和待补基本面字段。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#21070b"/>
      <stop offset="0.56" stop-color="#070405"/>
      <stop offset="1" stop-color="#5c0711"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0" stop-color="#ff7b86"/>
      <stop offset="1" stop-color="#ff243d"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" x2="1">
      <stop offset="0" stop-color="#fff1e5"/>
      <stop offset="1" stop-color="#ff8a94"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" rx="24" fill="url(#bg)"/>
  <path d="M0 78H720M0 156H720M0 234H720M0 312H720M90 0V420M180 0V420M270 0V420M360 0V420M450 0V420M540 0V420M630 0V420" stroke="#fff" stroke-opacity=".06"/>
  <g fill="#15070a" stroke="#ff6b78" stroke-opacity=".38">
    <rect x="46" y="44" width="188" height="96" rx="16"/>
    <rect x="266" y="44" width="188" height="96" rx="16"/>
    <rect x="486" y="44" width="188" height="96" rx="16"/>
    <rect x="46" y="178" width="292" height="178" rx="18"/>
    <rect x="382" y="178" width="292" height="178" rx="18"/>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" fill="#fff7f7">
    <text x="70" y="76" font-size="21" opacity=".9" font-weight="800">财报覆盖</text>
    <text x="70" y="117" font-size="34" font-weight="900">0/100</text>
    <text x="70" y="132" font-size="11" opacity=".58" font-weight="700">营收 / ROE / 现金流待补</text>
    <text x="290" y="76" font-size="21" opacity=".9" font-weight="800">PE覆盖</text>
    <text x="290" y="117" font-size="34" font-weight="900">83/100</text>
    <text x="290" y="132" font-size="11" opacity=".58" font-weight="700">可做估值筛选</text>
    <text x="510" y="76" font-size="21" opacity=".9" font-weight="800">PB覆盖</text>
    <text x="510" y="117" font-size="34" font-weight="900">100/100</text>
    <text x="510" y="132" font-size="11" opacity=".58" font-weight="700">账面估值字段完整</text>
    <text x="70" y="220" font-size="18" font-weight="900">基本面覆盖矩阵</text>
    <text x="406" y="220" font-size="18" font-weight="900">待补字段优先级</text>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="800">
    <text x="78" y="257" fill="#fff7f7" opacity=".75">财报字段</text>
    <rect x="150" y="246" width="150" height="13" rx="6" fill="#fff" opacity=".1"/>
    <rect x="150" y="246" width="2" height="13" rx="6" fill="url(#red)"/>
    <text x="308" y="257" fill="#fff1e5" opacity=".8">0%</text>
    <text x="78" y="293" fill="#fff7f7" opacity=".75">估值字段</text>
    <rect x="150" y="282" width="150" height="13" rx="6" fill="#fff" opacity=".1"/>
    <rect x="150" y="282" width="141" height="13" rx="6" fill="url(#red)"/>
    <text x="308" y="293" fill="#fff1e5" opacity=".8">94%</text>
    <text x="78" y="329" fill="#fff7f7" opacity=".75">市值字段</text>
    <rect x="150" y="318" width="150" height="13" rx="6" fill="#fff" opacity=".1"/>
    <rect x="150" y="318" width="149" height="13" rx="6" fill="url(#cream)"/>
    <text x="308" y="329" fill="#fff1e5" opacity=".8">99%</text>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity=".12">
    <path d="M414 326H646M414 289H646M414 252H646"/>
  </g>
  <g fill="url(#red)">
    <rect x="424" y="258" width="28" height="68" rx="7"/>
    <rect x="480" y="276" width="28" height="50" rx="7" opacity=".86"/>
    <rect x="536" y="266" width="28" height="60" rx="7" opacity=".92"/>
    <rect x="592" y="294" width="28" height="32" rx="7" opacity=".7"/>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" fill="#fff7f7" opacity=".72" font-size="10" font-weight="700">
    <text x="415" y="344">营收</text>
    <text x="476" y="344">ROE</text>
    <text x="528" y="344">现金流</text>
    <text x="588" y="344">负债率</text>
  </g>
  <text x="46" y="386" fill="#fff7f7" opacity=".5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">Top100样本；财报表0行，估值字段来自日频估值与市值快照</text>
</svg>
